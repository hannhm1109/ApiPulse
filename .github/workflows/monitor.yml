name: Monitor production demo

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apipulse-production-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    if: vars.ENABLE_MONITORING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Run one protected scheduler batch
        env:
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/trigger-scheduler.mjs
